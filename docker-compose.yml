services:
  postgres:
    image: postgres:17
    container_name: orcafacil-postgres
    environment:
      POSTGRES_DB: orcafacil
      POSTGRES_USER: orcafacil_user
      POSTGRES_PASSWORD: ${ORCAFACIL_DB_PASSWORD:?configure no .env}
    ports: ["5432:5432"]
    volumes:
      - orcafacil_pgdata:/var/lib/postgresql/data
      # O initdb executa este script somente quando o volume PostgreSQL é novo.
      # Para volumes existentes, recrie o volume ou rode database/script_completop.sql manualmente.
      - ./database/script_completop.sql:/docker-entrypoint-initdb.d/01-script-completo.sql:ro
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?configure no .env}
    ports: ["5050:80"]
volumes: { orcafacil_pgdata: {} }
