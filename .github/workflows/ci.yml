name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:js
      - run: npm run build:prod
      - run: npm run security:check
      - run: test -f dist/index.html && test -f dist/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: orcafacil-dist
          path: dist
