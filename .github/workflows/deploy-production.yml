name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: production
      deploy_hosting:
        type: boolean
        default: true
      deploy_rules:
        type: boolean
        default: false
      deploy_functions:
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - uses: w9jds/firebase-action@v13.12.0
        if: ${{ inputs.deploy_rules }}
        with: { args: deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} }
        env: { GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORCAFACIL }} }
      - uses: w9jds/firebase-action@v13.12.0
        if: ${{ inputs.deploy_functions }}
        with: { args: deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} }
        env: { GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORCAFACIL }} }
      - uses: w9jds/firebase-action@v13.12.0
        if: ${{ inputs.deploy_hosting }}
        with: { args: deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} }
        env: { GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORCAFACIL }} }
      - run: |
          echo "## Deploy produção" >> $GITHUB_STEP_SUMMARY
          echo "Hosting: ${{ inputs.deploy_hosting }}" >> $GITHUB_STEP_SUMMARY
          echo "Rules: ${{ inputs.deploy_rules }}" >> $GITHUB_STEP_SUMMARY
          echo "Functions: ${{ inputs.deploy_functions }}" >> $GITHUB_STEP_SUMMARY
