<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico — OrçaFácil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="mb-4">
      <a class="btn btn-outline-secondary btn-sm" href="./index.html">Voltar ao sistema</a>
    </div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="fw-bold">Diagnóstico de publicação estática</h1>
        <p class="text-secondary">Use esta página sem login para validar protocolo, caminhos, módulos, Firebase config e armazenamento local.</p>
        <div id="results" class="row g-3"></div>
        <div id="guidance" class="alert mt-4"></div>
      </div>
    </div>
  </main>
  <script type="module">
    const results = document.querySelector('#results');
    const guidance = document.querySelector('#guidance');
    const add = (title, value, ok = true) => {
      results.insertAdjacentHTML('beforeend', `<div class="col-md-6"><div class="p-3 rounded-4 border bg-white h-100"><div class="fw-bold">${title}</div><div class="${ok ? 'text-success' : 'text-danger'}">${value}</div></div></div>`);
    };
    const protocol = window.location.protocol;
    const host = window.location.hostname;
    const isFile = protocol === 'file:';
    const isLocalhost = ['localhost', '127.0.0.1', '::1'].includes(host);
    const looksFirebase = /web\.app$|firebaseapp\.com$/.test(host);
    const looksIis = !looksFirebase && !isFile && /localhost|\.|^[\w-]+$/.test(host);

    add('URL atual', window.location.href);
    add('Protocolo', protocol, protocol === 'http:' || protocol === 'https:');
    add('Tipo de acesso', isFile ? 'file:// detectado' : (protocol === 'https:' ? 'HTTPS' : 'HTTP'), !isFile);
    add('Localhost', isLocalhost ? 'Sim' : 'Não');
    add('Parece IIS', looksIis ? 'Possível/compatível com servidor estático' : 'Não identificado');
    add('Parece Firebase Hosting', looksFirebase ? 'Sim' : 'Não');

    try {
      const config = await import('./js/core/config.js');
      add('Teste de JS module', `OK — ${config.APP_NAME} ${config.APP_VERSION}`);
      add('BASE_PATH', config.BASE_PATH || '/');
    } catch (err) {
      add('Teste de JS module', `Falhou: ${err.message}`, false);
    }

    try {
      const fb = await import('./js/firebase-config.js');
      add('Firebase config', `OK — projectId ${fb.firebaseConfig.projectId}`);
    } catch (err) {
      add('Firebase config', `Falhou: ${err.message}`, false);
    }

    try {
      const key = 'orcafacil:diagnostico';
      localStorage.setItem(key, new Date().toISOString());
      add('localStorage', `OK — ${localStorage.getItem(key)}`);
      localStorage.removeItem(key);
    } catch (err) {
      add('localStorage', `Falhou: ${err.message}`, false);
    }

    if (isFile) {
      guidance.className = 'alert alert-warning mt-4';
      guidance.innerHTML = '<strong>Correção:</strong> não abra por <code>file://</code>. Execute <code>npm start</code> e acesse <code>http://localhost:8095</code>, ou publique a pasta <code>public</code> em Firebase Hosting/IIS/Apache/Nginx.';
    } else {
      guidance.className = 'alert alert-success mt-4';
      guidance.innerHTML = '<strong>Ambiente HTTP/HTTPS detectado.</strong> Se todos os testes estão OK, a publicação estática está pronta para uso. No Firebase Auth, confirme também o domínio autorizado no Console.';
    }
  </script>
</body>
</html>
